name: CI
on:
  pull_request:
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:

env:
  # Pinned to the rev the manifest was written against. Bump deliberately.
  TOLLGATE_RS_REV: 5b5e045c09a6d7e710b6412c9a34581834db5dd0
  FIPS_REV: 6c3e1c844d91385656b5fc9611663332dd530647

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cargo.toml names tollgate-protocol and tollgate-core by absolute path
      # (/home/c08r4d0r/repos/tollgate-rs/...), which only resolves on one
      # developer's machine. Repoint the two paths at a checkout instead.
      #
      # The checkout goes OUTSIDE the repo on purpose. Nested under it, cargo
      # walks up from the dependency and finds our workspace root first, so the
      # dep's `workspace = true` fields inherit from our manifest - which has no
      # rust-version - and the manifest fails to parse before any code compiles.
      # Actions' own checkout refuses a path outside $GITHUB_WORKSPACE, hence a
      # plain git clone.
      - name: Fetch tollgate-rs at the pinned rev
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/OpenTollGate/tollgate-rs.git ../deps/tollgate-rs
          git -C ../deps/tollgate-rs checkout --detach "$TOLLGATE_RS_REV"
          git -C ../deps/tollgate-rs log --oneline -1

      - name: Point the path dependencies at the checkout
        run: |
          set -euo pipefail
          sed -i "s|/home/c08r4d0r/repos/tollgate-rs|$PWD/../deps/tollgate-rs|g" Cargo.toml
          grep -n 'tollgate-rs' Cargo.toml

      # reference/fips is a gitignored local clone, so a fresh checkout has no
      # fips-mesh package and cargo refuses to resolve the workspace at all -
      # even though the dep is optional and the default feature set never uses
      # it. Cargo resolves the whole graph before deciding that.
      - name: Fetch the FIPS dependency
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/jmcorgan/fips.git reference/fips
          git -C reference/fips checkout --detach "$FIPS_REV"
          git -C reference/fips log --oneline -1

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test -p tollgate-mobile

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch tollgate-rs at the pinned rev
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/OpenTollGate/tollgate-rs.git ../deps/tollgate-rs
          git -C ../deps/tollgate-rs checkout --detach "$TOLLGATE_RS_REV"
          git -C ../deps/tollgate-rs log --oneline -1

      - name: Point the path dependencies at the checkout
        run: |
          set -euo pipefail
          sed -i "s|/home/c08r4d0r/repos/tollgate-rs|$PWD/../deps/tollgate-rs|g" Cargo.toml
          grep -n 'tollgate-rs' Cargo.toml

      - name: Fetch the FIPS dependency
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/jmcorgan/fips.git reference/fips
          git -C reference/fips checkout --detach "$FIPS_REV"
          git -C reference/fips log --oneline -1

      - uses: dtolnay/rust-toolchain@stable

      # The runner image ships the NDK. The previous step pulled
      # nllkl/setup-android-ndk, which returns 404, so this job died at
      # "Set up job" before a single command ran.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cross-compile for arm64
        run: |
          set -euo pipefail
          echo "NDK: ${ANDROID_NDK_HOME:?the runner image should provide this}"
          cargo ndk -t arm64-v8a build -p tollgate-mobile --release

      - name: Build the APK
        run: cd android && ./gradlew assembleDebug
